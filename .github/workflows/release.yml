name: Release

on:
  push:
    branches: [master]
    paths:
      - packages/docmosis-tools/bin/**
      - packages/docmosis-tools/lib/**
      - packages/docmosis-tools/index.mjs
      - packages/docmosis-tools/index.d.ts
      - packages/docmosis-tools/package.json
      - extensions/template-preview/**
      - package.json
      - package-lock.json

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test --workspace packages/docmosis-tools
      - name: Set the extension version
        id: version
        working-directory: extensions/template-preview
        run: |
          # The Marketplace rejects a version it already has; the run number only increases.
          version="0.1.${GITHUB_RUN_NUMBER}"
          npm pkg set "version=${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build the extension
        working-directory: extensions/template-preview
        run: |
          npm test
          npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "vscode-v${VERSION}" extensions/template-preview/hmcts-template-preview.vsix \
            --target "$GITHUB_SHA" \
            --title "vscode-v${VERSION}" \
            --notes "HMCTS Template Preview ${VERSION}, built from ${GITHUB_SHA}." \
            --latest
      - name: Publish to the Marketplace and Open VSX
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run publish.yml -f "tag=vscode-v${VERSION}" --ref "$BRANCH"
