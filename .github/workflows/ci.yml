name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bash -n bin/docmosis
      - run: bin/docmosis --help
      - run: node --test test/*.test.mjs

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: hmcts-template-preview
          path: vscode/hmcts-template-preview.vsix
          if-no-files-found: error
