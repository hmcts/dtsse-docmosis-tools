name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  docmosis-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/docmosis-tools
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: node bin/docmosis.mjs --help
      - run: bin/docmosis --help
      - run: node --test test/*.test.mjs
      - run: npm pack --dry-run

  notify-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/notify-tools
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --test test/*.test.mjs
      - run: npm pack --dry-run

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: extensions/template-preview
            vsix: hmcts-template-preview
          - directory: extensions/notify
            vsix: hmcts-notify
          - directory: extensions/jenkins
            vsix: dtsse-jenkins
            lint: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
        if: matrix.lint
        working-directory: ${{ matrix.directory }}
      - run: npm run build
        working-directory: ${{ matrix.directory }}
      - run: npm test
        working-directory: ${{ matrix.directory }}
      - run: npm run package
        working-directory: ${{ matrix.directory }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.vsix }}
          path: ${{ matrix.directory }}/${{ matrix.vsix }}.vsix
          if-no-files-found: error
