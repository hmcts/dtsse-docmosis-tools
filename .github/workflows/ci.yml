name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/docmosis-tools
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: node bin/docmosis.mjs --help
      - run: bin/docmosis --help
      - run: node --test test/*.test.mjs
      - run: npm pack --dry-run

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
        working-directory: extensions/template-preview
      - run: npm test
        working-directory: extensions/template-preview
      - run: npm run package
        working-directory: extensions/template-preview
      - uses: actions/upload-artifact@v7
        with:
          name: hmcts-template-preview
          path: extensions/template-preview/hmcts-template-preview.vsix
          if-no-files-found: error
