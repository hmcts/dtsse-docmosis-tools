name: Publish npm package

on:
  push:
    branches: [master]
    paths:
      - packages/docmosis-tools/bin/**
      - packages/docmosis-tools/lib/**
      - packages/docmosis-tools/index.mjs
      - packages/docmosis-tools/index.d.ts
      - packages/docmosis-tools/package.json

# Overlapping publishes would race on the version number, so a release in progress is never cancelled.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # No id-token: Azure Artifacts does not support npm provenance.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/docmosis-tools
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # CI runs on pull requests only, so a direct push to master is gated here.
      - name: Test
        run: node --test test/*.test.mjs

      - name: Check the package contents
        run: npm pack --dry-run

      # A version set by hand on master is published as it stands; anything else gets a patch
      # bump. The npm-v<version> tag marks a version as released, and the loop steps past every
      # tagged version. The extension's vscode-v tags are a separate series.
      - name: Resolve the version to publish
        id: bump
        run: |
          current="$(node -p 'require("./package.json").version')"
          while git rev-parse -q --verify "refs/tags/npm-v${current}" >/dev/null; do
            npm version patch --no-git-tag-version --no-workspaces-update
            current="$(node -p 'require("./package.json").version')"
          done
          echo "publishing npm-v${current}"
          echo "version=${current}" >> "$GITHUB_OUTPUT"

      - name: Configure npm authentication for Azure Artifacts
        env:
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
          FEED_URL: https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/npm/registry/
          NPM_SCOPE: '@hmcts-cft'
        run: |
          token_b64="$(printf %s "$AZURE_DEVOPS_ARTIFACT_TOKEN" | base64 | tr -d '\n')"
          username="${AZURE_DEVOPS_ARTIFACT_USERNAME:-github}"
          feed="${FEED_URL%/}/"
          # npm auth keys are "//host/path/", without the scheme.
          feed_no_scheme="${feed#https:}"
          cat > "$HOME/.npmrc" <<EOF
          registry=${feed}
          always-auth=true
          ${feed_no_scheme}:username=${username}
          ${feed_no_scheme}:_password=${token_b64}
          ${feed_no_scheme}:email=github-actions@hmcts.net
          EOF
          # npm prefers @<scope>:registry over registry=, so this keeps the scope on the feed even if
          # publishConfig.registry goes missing.
          echo "@${NPM_SCOPE#@}:registry=${feed}" >> "$HOME/.npmrc"

      - name: Publish
        run: npm publish

      # Publish first: a tag with no package behind it is harmless, since the next run bumps past
      # it. A published version that master does not record is not: every later run resolves to
      # the same number and the feed refuses it for good, so the push below has to survive a
      # merge landing while the gates ran.
      - name: Commit the bump and tag the release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          UNRECORDED="published npm-v${VERSION} but could not record the bump on ${GITHUB_REF_NAME}. Set version to ${VERSION} in package.json by hand, or the next release will retry a version the feed already has."
          # A version master already records needs no commit, and `git commit` on a clean tree
          # exits non-zero.
          if git diff --cached --quiet; then
              published="$(git rev-parse HEAD)"
          else
              # This cannot loop: pushes made with GITHUB_TOKEN do not trigger workflows.
              git commit -m "chore: release npm-v${VERSION} [skip ci]"
              # The commit that was gated and packed, pinned before the loop below can rebase it
              # onto a merge that landed meanwhile, so the tag points at what the feed has.
              published="$(git rev-parse HEAD)"
              # A merge during the gates leaves this push non-fast-forward. Rebase onto it and retry:
              # the commit touches package.json alone, and the concurrency group keeps other
              # releases from moving that file.
              for attempt in 1 2 3; do
                  if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                      break
                  fi
                  if [ "$attempt" = 3 ]; then
                      echo "::error::${UNRECORDED}" >&2
                      exit 1
                  fi
                  # A conflicting rebase is plausible when a merge edits the top of package.json;
                  # catching it keeps the way out in the error message.
                  git fetch origin "${GITHUB_REF_NAME}" || true
                  git rebase "origin/${GITHUB_REF_NAME}" || {
                      echo "::error::${UNRECORDED}" >&2
                      exit 1
                  }
              done
          fi
          # Fatal, because the next run reads the tag to know this version is taken.
          git push origin "${published}:refs/tags/npm-v${VERSION}" || {
              echo "::error::published npm-v${VERSION} but could not tag it. Run: git push origin ${published}:refs/tags/npm-v${VERSION}" >&2
              exit 1
          }
